<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ultrasonic-iot</title>
  </head>
  <body>
    <script>
      // If redirected from GitHub Pages 404.html with ?redirect=, restore the original path
      try {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        if (redirect) {
          const decoded = decodeURIComponent(redirect);
          // Use history.replaceState to set the original path without reloading
          window.history.replaceState(null, '', decoded + window.location.hash);
        }
      } catch (e) {
        // ignore
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
